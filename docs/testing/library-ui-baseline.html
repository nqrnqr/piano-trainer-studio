<h1>Library UI regression checks</h1><p>Actual folder/list/drawer events, file import, backup and disposal. Uses disposable native databases and in-memory preferences.</p>
<button id="run" disabled>Run checks</button><pre id="results">Loading</pre><iframe title="App under test"></iframe>
<script>

(async()=>{const html=await(await fetch('/index.html')).text(),boot=new URLSearchParams(location.search).get('led')==='off'?'<script>window.__PT_BOOT_OPTIONS__={ledEnabled:false};<'+'/script>':'';
frame.srcdoc=html.replace('<head>','<head><base href="/">'+boot+'<script src="/docs/testing/library-fixture.js"><'+'/script><script src="/docs/testing/library-ui-fixture.js"><'+'/script>');})();
</script>
