<!doctype html><meta charset="utf-8"><title>Library UI regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:1200px;height:460px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:400px;overflow:auto}</style>
<h1>Library UI regression checks</h1><p>Actual folder/list/drawer events, file import, backup and disposal. Uses disposable native databases and in-memory preferences.</p>
<button id="run" disabled>Run checks</button><pre id="results">Loading</pre><iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/library-ui-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{observeSources:true,fixtures:['library-ui-fixture.js']});
</script>
