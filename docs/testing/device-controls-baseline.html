<!doctype html><meta charset="utf-8"><title>Device controls lifetime checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:1200px;height:600px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:420px;overflow:auto}</style>
<h1>Device controls lifetime checks</h1><p>Native playable-range selection, connection display and update request disposal.</p>
<button id="run" disabled>Run checks</button><pre id="results">Loading</pre><iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};

mountModuleTestFrame(frame,{observeSources:true,fixtures:['device-controls-fixture.js']});
</script>
