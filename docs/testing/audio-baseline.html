<!doctype html>
<meta charset="utf-8">
<title>Audio boundary regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:350px;overflow:auto}</style>
<h1>Audio boundary regression checks</h1>
<p>Loads the current static entry, real Tone nodes and local sampler assets. The output is muted. A test MIDI provider records routed bytes. Audible quality, physical MIDI and audio/metronome synchronization require manual checks.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Loading</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/audio-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{fixtures:['midi-device-fixture.js'],lateFixtures:["audio-tone-fixture.js"]});
</script>
