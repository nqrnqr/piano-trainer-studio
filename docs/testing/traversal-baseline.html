<!doctype html>
<meta charset="utf-8">
<title>Shared traversal regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:300px;overflow:auto}</style>
<h1>Shared traversal regression checks</h1>
<p>Actual OSMD and practice input, with the legacy LED adapter or ?led=off. Uses native animation frames. Audio and hardware routes are disabled.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Ready</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/traversal-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{preferences:new URLSearchParams(location.search).get('led')==='off'?{pt_ledOutputMode:'wled',pt_wledIp:'127.0.0.1:9',pt_wledTransport:'ddp'}:{}});
</script>
