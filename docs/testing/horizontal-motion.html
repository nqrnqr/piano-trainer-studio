<!doctype html>
<meta charset="utf-8">
<title>Horizontal native motion checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:600px;height:480px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:220px;overflow:auto}h1{font-size:18px}</style>
<h1>Horizontal native motion checks</h1>
<p>Native foreground animation frames and real SVG; scripted playback clock. Records visual positions across repeats, Loop and recycling.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Ready</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/horizontal-motion.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{ports:{controlledPlayback:true},preferences:{pt_ledOutputMode:'none'}});
</script>
