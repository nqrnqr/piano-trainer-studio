<!doctype html><meta charset="utf-8"><title>Horizontal notation and navigation checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:550px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:240px;overflow:auto}</style>
<h1>Horizontal notation and navigation checks</h1><p>Real local OSMD, finite connection context and manually specified navigation paths. Outputs are muted.</p>
<button id="run" disabled>Run checks</button><pre id="results">Ready</pre><iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script><script>
const frame=document.querySelector('iframe');frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/horizontal-notation.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{ports:{controlledPlayback:true},preferences:{pt_ledOutputMode:'none'}});
</script>
