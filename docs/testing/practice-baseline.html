<!doctype html>
<meta charset="utf-8">
<title>Practice baseline regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:240px;overflow:auto}h1{font-size:18px}</style>
<h1>Practice baseline regression checks</h1>
<p id="environment"></p>
<p>Exercises the actual practice engine in both layouts and traverses synthetic MusicXML repeat signs. Audio, metronome and hardware routes are disabled. Reload the frame to restore the app after testing.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Ready</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/practice-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame);
</script>
