<!doctype html>
<meta charset="utf-8">
<title>Score display regression checks</title>
<style>body{font:14px system-ui;margin:12px} iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;height:110px;overflow:auto}h1{font-size:18px}</style>
<h1>Score display regression checks</h1>
<p>Runs against the local app with a synthetic piano score. Audio and hardware outputs are disabled in the test frame.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Ready</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/score-display.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame);
</script>
