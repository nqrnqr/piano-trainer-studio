<!doctype html>
<meta charset="utf-8">
<title>MIDI service regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:300px;overflow:auto}</style>
<h1>MIDI service regression checks</h1>
<p>Loads the actual static entry with a simulated Web MIDI provider injected before startup. Uses real DOM controls, OSMD and practice input; physical devices and audio are not tested.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Loading</pre>
<iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/midi-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame,{fixtures:['midi-device-fixture.js']});
</script>
