<!doctype html>
<meta charset="utf-8">
<title>MIDI service regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:100%;height:500px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:300px;overflow:auto}</style>
<h1>MIDI service regression checks</h1>
<p>Loads the actual static entry with a simulated Web MIDI provider injected before startup. Uses real DOM controls, OSMD and practice input; physical devices and audio are not tested.</p>
<button id="run" disabled>Run checks</button>
<pre id="results">Loading</pre>
<iframe title="App under test"></iframe>
<script>
const keys=['pt_savedMidiIn','pt_savedMidiInName','pt_savedMidiInChannel','pt_savedMidiOut','pt_savedMidiOutName','pt_savedMidiOutChannel','pt_savedMidiLights','pt_savedMidiLightsName','pt_savedMidiLightsChannel','pt_ledOutputMode'];
const saved=new Map(keys.map(key=>[key,localStorage.getItem(key)]));
window.restoreMidiTestPreferences=()=>{for(const [key,value]of saved){if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}};
window.addEventListener('pagehide',window.restoreMidiTestPreferences,{once:true});
const frame=document.querySelector('iframe');
frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{
    document.getElementById('run').disabled=true;
    const script=document.createElement('script');script.src='/docs/testing/midi-baseline.integration.js';
    frame.contentDocument.body.append(script);
};
(async()=>{
    const html=await (await fetch('/index.html')).text();
    // Production script order and markup remain authoritative; only the test
    // provider and resource base are inserted before that entry boots.
    frame.srcdoc=html.replace('<head>','<head><base href="/"><script src="/docs/testing/midi-device-fixture.js"><'+'/script>');
})();
</script>
