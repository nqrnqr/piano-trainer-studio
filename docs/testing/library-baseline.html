<!doctype html><meta charset="utf-8"><title>Library regression checks</title>
<style>body{font:14px system-ui;margin:12px}iframe{width:1200px;height:440px;border:1px solid #ccc}pre{white-space:pre-wrap;max-height:420px;overflow:auto}</style>
<h1>Library regression checks</h1><p>Native IndexedDB v1 CRUD, backup, errors, starter resources and drawer integration. Uses disposable test databases and in-memory preferences.</p>
<button id="run" disabled>Run checks</button><pre id="results">Loading</pre><iframe title="App under test"></iframe>
<script src="/docs/testing/module-test-frame.js"></script>
<script>
const frame=document.querySelector('iframe');frame.onload=()=>{document.getElementById('run').disabled=false;document.getElementById('results').textContent='Ready';};
document.getElementById('run').onclick=()=>{document.getElementById('run').disabled=true;const script=document.createElement('script');script.src='/docs/testing/library-baseline.integration.js';frame.contentDocument.body.append(script);};
mountModuleTestFrame(frame);
</script>
