name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Verify types, browser bundles and unit tests
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p .cache/pages/docs
          cp index.html style.css site.webmanifest version.json README.html README.md README.en.md quick-start.html LICENSE .cache/pages/
          cp -R assets js .cache/pages/
          cp docs/LED-Setup.html docs/LED-Setup.md docs/LED-Setup.en.md .cache/pages/docs/
          cp -R docs/screenshots .cache/pages/docs/
          touch .cache/pages/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
